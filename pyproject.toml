[project]
name = "verdict"
version = "0.1.0"
description = "Methods Verifier — decidable pre-submission verification for a manuscript's Methods (cell lines, antibodies, knockout-control reasoning, rigor), with measured abstention."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Sharab (Moe) Ahmad" }]
dependencies = [
    "anthropic>=0.40",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",   # isotonic / Platt calibration
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8.0"]

[project.scripts]
verdict = "verdict.__main__:main"

[tool.pytest.ini_options]
# only collect the real test suite — scripts/ holds runnable benchmarks (some end in _test.py and
# have module-level argv parsing that pytest must not import as tests).
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Package only the `verdict` package (+ any subpackages). Without this, setuptools flat-layout
# auto-discovery sees sibling dirs (web/, scripts/, benchmark/) as competing top-level packages and
# aborts the wheel build — which breaks the non-editable `pip install ".[web]"` in the Dockerfile.
[tool.setuptools.packages.find]
include = ["verdict*"]
namespaces = false
