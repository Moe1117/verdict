[project]
name = "verdict"
version = "0.1.0"
description = "A decidable evidence resolver for biomedical claims — with measured abstention."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Sharab (Moe) Ahmad" }]
dependencies = [
    "anthropic>=0.40",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",   # isotonic / Platt calibration
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8.0"]

[project.scripts]
verdict = "verdict.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
